name: Build Prompt Manager Desktop

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Package app
        run: npm run make
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: prompt-manager-installer
          path: dist/
